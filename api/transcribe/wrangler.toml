name = "alvoprompt-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
account_id = "8f0d2ed7851f91dd1efbaa53af71323d"

# Workers AI (plano gratuito: 10k neurônios/dia)
[ai]
binding = "AI"

# R2 (plano gratuito: 10 GB de armazenamento, 1M de leituras/mês)
[[r2_buckets]]
binding = "alvoprompt_media"
bucket_name = "alvoprompt-media"

# KV (plano gratuito: 100k leituras/dia) — sync de roteiros por frase-chave
[[kv_namespaces]]
binding = "ALVOPROMPT_SYNC"
id = "7f2df53777804be2aefce83dd26e3945"

# Uso local: npx wrangler dev --port 8787
# Publicar: npx wrangler deploy
# Origens autorizadas. Adicione o domínio público real antes do deploy.
[vars]
CORS_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,http://localhost,https://localhost,https://alvoprompter.com.br,https://www.alvoprompter.com.br"
FIREBASE_PROJECT_ID = "configure-o-id-do-projeto"
APP_URL = "https://www.alvoprompter.com.br"
ASAAS_API_BASE = "https://api-sandbox.asaas.com/v3"

# Banco de contas, assinaturas e RBAC.
[[d1_databases]]
binding = "DB"
database_name = "alvoprompter-saas"
database_id = "f7cd9af4-26f0-4d5a-ab25-8464581b84d3"
migrations_dir = "migrations"
